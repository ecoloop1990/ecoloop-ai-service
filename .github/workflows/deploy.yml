name: Deploy AI Service to EKS

on:
  push:
    branches:
      - feature/pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    env:
      EKS_CLUSTER_NAME: ecoloop-eks
      ECR_REPOSITORY: ecoloop-ai-service
      AWS_REGION: ${{ secrets.AWS_REGION }}
      ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com
      IMAGE_URI: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/ecoloop-ai-service:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        run: docker build -t ecoloop-ai-service .

      - name: Tag Docker image for ECR
        run: docker tag ecoloop-ai-service:latest $IMAGE_URI

      - name: Push Docker image to ECR
        run: docker push $IMAGE_URI

      - name: Update kubeconfig for EKS
        run: aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER_NAME

      - name: Deploy manifests to Kubernetes
        run: kubectl apply -f k8s/
