apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ecoloop-ai-service-hpa
  namespace: default
  labels:
    app: ecoloop-ai-service
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ecoloop-ai-service
  minReplicas: 1
  maxReplicas: 3
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  

