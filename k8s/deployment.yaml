apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoloop-ai
  labels:
    app: ecoloop-ai
    version: "2.0"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecoloop-ai
  template:
    metadata:
      labels:
        app: ecoloop-ai
        version: "2.0"
    spec:
      containers:
      - name: ecoloop-ai-service
        image: ecoloop-ai-service:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        env:
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: ecoloop-ai-config
              key: ENVIRONMENT
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: ecoloop-ai-config
              key: LOG_LEVEL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3

