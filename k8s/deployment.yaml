apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoloop-ai-service
  namespace: default
  labels:
    app: ecoloop-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecoloop-ai-service
  template:
    metadata:
      labels:
        app: ecoloop-ai-service
    spec:
      serviceAccountName: ecoloop-ai-service
      containers:
      - name: ecoloop-ai-service
        image: <account_id>.dkr.ecr.<region>.amazonaws.com/ecoloop-ai-service:latest
        imagePullPolicy: Always
        command: ["uvicorn"]
        args: ["app.main:app", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        envFrom:
        - configMapRef:
            name: ecoloop-ai-service-config
        resources:
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
