apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecoloop-ai-service
  namespace: default
  labels:
    app: ecoloop-ai-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ecoloop-ai-service
  template:
    metadata:
      labels:
        app: ecoloop-ai-service
    spec:
      serviceAccountName: ecoloop-ai-service
      containers:
      - name: ecoloop-ai-service
        image: 632150488624.dkr.ecr.us-east-1.amazonaws.com/ecoloop-ai-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        resources:
          limits:
            cpu: 1000m
            memory: 1Gi
          requests:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
